name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go
    runs-on: [self-hosted, inc28]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: |
          set -eu
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: cross-build (linux/amd64, darwin/arm64)
        run: |
          set -eu
          for target in linux/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            echo "building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o /dev/null .
          done

  helpers:
    name: helpers
    runs-on: [self-hosted, inc28]
    steps:
      - uses: actions/checkout@v4

      - name: python tests
        run: python3 -m unittest discover -s helpers/tests -t helpers/tests -p 'test_*.py'
